<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

    margin: 0; min-height: 100vh; background: linear-gradient(#006064, #00838f); color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 2.5rem 1rem; text-align: center;
  }
  main { max-width: 440px; margin: 0 auto; }
  h1 { margin: 0 0 .3rem; font-size: 1.9rem; font-weight: 900; }
  p { margin: 0 0 1.8rem; opacity: .85; }
  a {
    display: block; padding: 1.2rem 1.1rem; margin-bottom: 1rem; border-radius: 18px;
    color: #fff; text-decoration: none; border: 2px solid rgba(255,255,255,.25);

  a strong { display: block; font-size: 1.3rem; }
  a span { opacity: .85; font-size: .95rem; }
  .world { background: linear-gradient(#00acc1, #006064); }
  .europe { background: linear-gradient(#1A237E, #006064); }

<body>
<main>
  <h1>Periplo</h1>
  <p>Free on iPhone &amp; Android</p>
